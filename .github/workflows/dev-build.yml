name: Development Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Development Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Expo
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build development client
        working-directory: apps/native
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            -Dorg.gradle.parallel=false
            -Dorg.gradle.daemon=false
        run: |
          mkdir -p ../../artifacts

          eas build \
            --platform android \
            --profile development \
            --local \
            --non-interactive \
            --output ../../artifacts/zius-development.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: zius-android-development
          path: artifacts/zius-development.apk
          if-no-files-found: error

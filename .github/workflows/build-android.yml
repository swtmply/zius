name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Android AAB
        working-directory: apps/native
        run: |
          mkdir -p ../../artifacts

          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output ../../artifacts/zius.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: zius-android
          path: artifacts/zius.aab
